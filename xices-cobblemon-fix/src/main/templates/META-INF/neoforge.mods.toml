modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Codex for Xice"
description='''
Compatibility fixes for Cobblemon Integrations 1.1.6 on Cobblemon 1.8.0.
'''

[[mixins]]
config="xices_cobblemon_fix.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[21.1.250]"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="cobblemon"
type="required"
versionRange="[1.8.0,1.9.0)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="cobblemonintegrations"
type="required"
versionRange="[1.1.6]"
ordering="BEFORE"
side="BOTH"
