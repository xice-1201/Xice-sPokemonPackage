modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Codex for Xice"
description='''
Adds per-device progression modules to Cobblemon Smartphone.
'''

[[mixins]]
config="smartphoneprogression.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[21.1.250]"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="cobblemon"
type="required"
versionRange="[1.8.0,1.9.0)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="cobblemon_smartphone"
type="required"
versionRange="[1.1.3-patch1.8.0]"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="naturescompass"
type="required"
versionRange="[1.21.1-3.4.0-neoforge]"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="explorerscompass"
type="required"
versionRange="[1.21.1-3.4.0-neoforge]"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="cobblemonexpall"
type="required"
versionRange="[0.0.2]"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="curios"
type="required"
versionRange="[9.5.1+1.21.1]"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="accessories"
type="required"
versionRange="[1.1.0-beta.53+1.21.1]"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="mega_showdown"
type="required"
versionRange="[1.0+1.8+1.21.1-release-hotfix]"
ordering="AFTER"
side="BOTH"
