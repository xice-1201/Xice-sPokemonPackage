#输出监守者对战调试日志
warden_battle_debug_log = false

#Pokémon battle stats are compressed before entering Minecraft's attribute system.
[pokemon_attribute_mapping]
	#Max health = clamp(4 + sqrt(actual HP) * hp_scale, hp_min, hp_max).
	# Default: 2.0
	# Range: 0.0 ~ 20.0
	hp_scale = 2.0
	# Default: 4.0
	# Range: 1.0 ~ 1000.0
	hp_min = 4.0
	# Default: 80.0
	# Range: 1.0 ~ 1000.0
	hp_max = 80.0
	#Attack damage = clamp(1 + actual Attack / attack_scale, attack_min, attack_max). 32/18 keeps elite attackers near Sharpness V netherite sword and iron golem damage.
	# Default: 32.0
	# Range: 1.0 ~ 1000.0
	attack_scale = 32.0
	# Default: 1.0
	# Range: 0.0 ~ 1000.0
	attack_min = 1.0
	# Default: 18.0
	# Range: 0.0 ~ 1000.0
	attack_max = 18.0
	#Magic damage multiplier = 1 / (1 + actual Special Defence / this value). Around 500 Special Defence gives about 85% reduction, with no hard stat cap.
	# Default: 90.0
	# Range: 1.0 ~ 10000.0
	special_defence_magic_scale = 90.0
	#Normalized walk coefficient = 0.9 * clamp(0.50 + actual Speed / speed_scale, speed_min, speed_max). Swimming and flying use 1.2x this coefficient.
	# Default: 250.0
	# Range: 1.0 ~ 10000.0
	speed_scale = 250.0
	# Default: 0.5
	# Range: 0.01 ~ 2.0
	speed_min = 0.5
	# Default: 2.0
	# Range: 0.01 ~ 8.0
	speed_max = 2.0
	# Default: 5000.0
	# Range: 1.0 ~ 10000.0
	attack_interval_scale = 5000.0
	#Derived attack cooldown in ticks = clamp(attack_interval_scale / actual Speed, min, max). Extreme speed is about 10 ticks.
	# Default: 10.0
	# Range: 1.0 ~ 200.0
	attack_interval_min_ticks = 10.0
	# Default: 30.0
	# Range: 1.0 ~ 200.0
	attack_interval_max_ticks = 30.0
