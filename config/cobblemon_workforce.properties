# Cobblemon WorkForce 配置
# 宝可梦能源发生器每刻向每个侧面输出的最大 FE/RF。
max_output_per_side=1024
# 单个宝可梦能源发生器最多容纳的宝可梦数量。有效范围：1-6。
generator_max_pokemon=6
# 是否让机器中的第一只宝可梦显示在方块外并四处活动。
show_pokemon_outside=true
# 宝可梦可离开工作方块活动的最远曼哈顿距离。
pokemon_wander_range=6
# 所选能力每点个体值提供的额外工作强度百分比。0.5 表示 31 IV = +15.5%。
iv_bonus_percent_per_point=0.5
# 所选能力每 4 点努力值提供的额外工作强度百分比。0.25 表示 252 EV = +15.75%。
ev_bonus_percent_per_4_points=0.25
# 单个培育设备工作区内允许存在的原版动物上限；达到后停止继续繁殖。
breeder_max_animals=32
# 宝可梦陷入睡眠状态时，是否暂停其负责的机器。
sleep_status_pauses_machines=true
